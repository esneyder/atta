<style>

  .tinta { fill: var(--tinta); }
  .fondo { fill: var(--fondo); }
  .blk { rx: 0; }
  .text { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 120px; line-height: .92; letter-spacing: -0.03em; color: var(--tinta); margin: 0; }
  .tagline { font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--tinta-suave); margin: var(--space-2) 0 0; }
