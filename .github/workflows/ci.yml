name: ci

on:
  push:
    branches: [develop, "feat/**", "atta/**"]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  spine-tests:
    name: spine tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "atta-ci"
          git config --global user.email "atta-ci@example.invalid"
      - name: Run the spine test suite
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v
