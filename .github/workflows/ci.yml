name: ci

# Pull requests to develop run this once per commit (no push trigger for feat/**: it ran every
# PR commit twice). macOS lives in ci-macos.yml so GitHub's macOS queue never blocks a PR.
on:
  push:
    branches: [develop, "atta/**"]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  spine-tests:
    name: spine tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "atta-ci"
          git config --global user.email "atta-ci@example.invalid"
      - name: Run the spine test suite
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v

  install:
    name: pip install (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Atta into a fresh venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/atta-venv"
          if [ -d "$RUNNER_TEMP/atta-venv/Scripts" ]; then bin="$RUNNER_TEMP/atta-venv/Scripts"; else bin="$RUNNER_TEMP/atta-venv/bin"; fi
          "$bin/python" -m pip install .
          echo "$bin" >> "$GITHUB_PATH"
      - name: Run the installed commands outside the checkout
        shell: bash
        run: |
          proj="$RUNNER_TEMP/proyecto"
          git init -q "$proj"
          cd "$RUNNER_TEMP"
          command -v atta atta-board
          atta --help
          atta-board --help
          # S11: accents survive a pipe (UTF-8 on every OS).
          atta-board --help | grep -q "máquina"
          out="$(atta --project "$proj" status | tr -d '\r')"
          echo "$out"
          test "$out" = "No hay jobs."
          cd "$proj"
          test "$(atta status | tr -d '\r')" = "No hay jobs."
      - name: Run the F3 commands of the installed package
        shell: bash
        run: |
          proj="$RUNNER_TEMP/proyecto"
          cd "$RUNNER_TEMP"
          # S11: in a bare project doctor and init --check report problems (exit 1); exit 2 or a
          # Python traceback is a bug of Atta.
          run_allowing_1() {
            set +e
            out="$("$@" 2>&1)"
            code=$?
            set -e
            echo "$out"
            echo "exit code: $code"
            if grep -q "Traceback (most recent call last)" <<<"$out"; then
              echo "::error::$* imprimió un traceback"; exit 1
            fi
            if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
              echo "::error::$* salió con $code"; exit 1
            fi
          }
          run_allowing_1 atta --project "$proj" doctor --no-github
          run_allowing_1 atta --project "$proj" init --check
          out="$(atta --project "$proj" memory 2>&1 | tr -d '\r')"
          echo "$out"
          test "$out" = "Todavía no hay lecciones en atta/memory/lessons.md."

  ast-grep:
    name: Filtro with real ast-grep (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "atta-ci"
          git config --global user.email "atta-ci@example.invalid"
      - name: Install ast-grep
        run: |
          python -m pip install ast-grep-cli
          ast-grep --version
      - name: Run the real ast-grep test (fails instead of skipping without the binary)
        env:
          PYTHONUTF8: "1"
          ATTA_REQUIRE_AST_GREP: "1"
        run: python -m unittest discover -s tests -p test_gate_astgrep_real.py -v
